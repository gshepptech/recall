<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Recall">
  <defs>
    <linearGradient id="grad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="bgglow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#1b1147"/>
      <stop offset="1" stop-color="#0b1022"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="252" height="252" rx="56" fill="url(#bgglow)" stroke="#2a2150" stroke-width="2"/>

  <!-- constellation of memory nodes rising from the tome -->
  <g stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#soft)">
    <line x1="128" y1="58" x2="88" y2="94"/>
    <line x1="128" y1="58" x2="170" y2="90"/>
    <line x1="88" y1="94" x2="128" y2="112"/>
    <line x1="170" y1="90" x2="128" y2="112"/>
    <line x1="88" y1="94" x2="60" y2="130"/>
    <line x1="170" y1="90" x2="198" y2="126"/>
    <line x1="128" y1="112" x2="152" y2="142"/>
    <line x1="128" y1="112" x2="128" y2="158"/>
  </g>
  <g fill="url(#grad)" filter="url(#soft)">
    <circle cx="128" cy="58" r="6.5"/>
    <circle cx="88" cy="94" r="4.5"/>
    <circle cx="170" cy="90" r="4.5"/>
    <circle cx="128" cy="112" r="5"/>
    <circle cx="60" cy="130" r="3.5"/>
    <circle cx="198" cy="126" r="3.5"/>
    <circle cx="152" cy="142" r="3.5"/>
  </g>

  <!-- open tome -->
  <g>
    <!-- left page -->
    <path d="M128 166 C104 150 72 148 46 156 L46 202 C72 194 104 196 128 210 Z"
          fill="url(#grad)" fill-opacity="0.16" stroke="url(#grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- right page -->
    <path d="M128 166 C152 150 184 148 210 156 L210 202 C184 194 152 196 128 210 Z"
          fill="url(#grad)" fill-opacity="0.16" stroke="url(#grad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- spine -->
    <line x1="128" y1="166" x2="128" y2="210" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- page lines -->
    <g stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <path d="M70 168 C88 165 106 167 120 174" fill="none"/>
      <path d="M66 180 C86 177 106 179 120 186" fill="none"/>
      <path d="M186 168 C168 165 150 167 136 174" fill="none"/>
      <path d="M190 180 C170 177 150 179 136 186" fill="none"/>
    </g>
  </g>
</svg>
