# Tool settings only; packaging lives in setup.py.

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# ruff's default rule set: pyflakes plus the pycodestyle errors that are never style opinions.
select = ["E4", "E7", "E9", "F"]
# The storage and auth modules keep short guard clauses and paired assignments on one line.
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["recall/tests"]
