# Recall — full stack in one command.
#   ./install.sh                 # generates .env, builds, and launches everything
#   docker compose up -d         # if you already have a .env
#   docker compose --profile embedder up -d   # also start the local Ollama embedder

services:

  # ── Recall memory server ──────────────────────────────────────────────────────
  recall:
    build: .
    container_name: recall_server
    env_file: .env
    environment:
      DB_BACKEND: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-recall}
      DB_USER: ${POSTGRES_USER:-recall}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      RECALL_HOST: 0.0.0.0
      RECALL_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recall_postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-recall}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recall} -d ${POSTGRES_DB:-recall}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Local embedder (opt-in: `--profile embedder`) — semantic search, zero egress ──
  # After it's up:  docker exec recall_ollama ollama pull nomic-embed-text
  # Then set in .env: OPENAI_API_BASE=http://ollama:11434/v1, OPENAI_API_KEY=local,
  #                   RECALL_EMBEDDING_MODEL=nomic-embed-text, RECALL_EMBED_DIM=768
  ollama:
    image: ollama/ollama:latest
    container_name: recall_ollama
    profiles: ["embedder"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
